<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VeredasApp Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="vpv%20logo.jpeg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #1D9E75; --bg: #f4f7f6; --dark: #1f2937; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--dark); }
        .app-shell { max-width: 500px; margin: 0 auto; min-height: 100vh; background: white; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
        .screen { display: none; flex-direction: column; flex: 1; animation: fadeIn 0.2s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header { padding: 18px 20px; background: white; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .container { padding: 20px; flex: 1; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: #f3f4f6; color: var(--dark); margin-top: 10px; }
        
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #e5e7eb; border-radius: var(--radius); font-size: 16px; background: #f9fafb; }

        .obra-btn { background: white; border: 1px solid #e5e7eb; border-radius: var(--radius); padding: 18px; margin-bottom: 15px; text-align: left; cursor: pointer; width: 100%; }
        
        .map-container { width: 100%; height: 180px; border-radius: var(--radius); overflow: hidden; margin: 15px 0; border: 1px solid #ddd; }
        .map-container iframe { width: 100%; height: 100%; border: 0; }

        .mat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .mat-card { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 10px; }
        .mat-val { display: block; font-size: 16px; font-weight: 800; color: var(--primary); }
        .mat-label { font-size: 9px; color: #166534; font-weight: 600; text-transform: uppercase; }

        .photo-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .p-tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; background: #eee; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .p-tab.active { background: var(--primary); color: white; }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .photo-item { width: 100%; aspect-ratio: 1; background: #eee; border-radius: 8px; object-fit: cover; border: 1px solid #ddd; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 500px; margin: 0 auto; padding: 25px; border-radius: 24px 24px 0 0; }

        /* Loader para fotos */
        #loader { display:none; font-size: 12px; color: var(--primary); text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="screen active" id="scr-login">
        <div class="container" style="text-align:center; padding-top:80px;">
            <img src="vpv%20logo.jpeg" alt="Logo de la empresa" style="width:70px; height:70px; border-radius:20px; margin-bottom:15px; object-fit: contain; background: var(--primary); padding: 5px;">
            <h1 style="margin-bottom:30px;">VeredasApp</h1>
            <input type="text" id="log-user" placeholder="Usuario">
            <input type="password" id="log-pass" placeholder="Contraseña">
            <button class="btn btn-primary" onclick="login()">Entrar</button>
        </div>
    </div>

    <div class="screen" id="scr-admin">
        <header><strong>Panel Admin</strong> <i class="ti ti-logout" onclick="location.reload()"></i></header>
        <div class="container">
            <button class="btn btn-primary" onclick="openModal('mod-obra')" style="margin-bottom:10px;">+ Nueva Obra</button>
            <button class="btn btn-outline" onclick="openModal('mod-cap')" style="margin-bottom:20px;">+ Nuevo Capataz</button>
            <div id="lista-obras"></div>
        </div>
    </div>

    <div class="screen" id="scr-cap">
        <header><strong id="cap-name-header">Capataz</strong> <i class="ti ti-logout" onclick="location.reload()"></i></header>
        <div class="container">
            <h3>Mis Obras Asignadas</h3><br>
            <div id="lista-obras-cap"></div>
        </div>
    </div>

    <div class="screen" id="scr-detalle">
        <header><i class="ti ti-arrow-left" onclick="back()"></i> <strong>Detalle de Obra</strong> <div></div></header>
        <div class="container" id="detalle-content"></div>
    </div>
</div>

<div class="modal" id="mod-obra">
    <div class="modal-content">
        <h3>Cargar Nueva Obra</h3><br>
        <input type="text" id="o-dir" placeholder="Dirección exacta">
        <input type="number" id="o-mts" placeholder="Metros cuadrados (m²)">
        <label style="font-size: 12px; color: gray; display: block; margin-bottom: 5px;">Fecha de Inicio:</label>
        <input type="date" id="o-f-ini">
        <select id="o-cap-sel"></select>
        <button class="btn btn-primary" onclick="crearObra()">Guardar Obra</button>
        <button class="btn btn-outline" onclick="closeModal('mod-obra')">Cancelar</button>
    </div>
</div>

<div class="modal" id="mod-cap">
    <div class="modal-content">
        <h3>Registrar Capataz</h3><br>
        <input type="text" id="c-nom" placeholder="Nombre completo">
        <input type="text" id="c-usr" placeholder="Usuario">
        <input type="password" id="c-pwd" placeholder="Contraseña">
        <button class="btn btn-primary" onclick="crearCap()">Guardar Capataz</button>
        <button class="btn btn-outline" onclick="closeModal('mod-cap')">Cancelar</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN SUPABASE (Reemplaza con tus credenciales)
    const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
    const SUPABASE_KEY = 'tu-anon-key';
    const supabase = exports.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let db = { obras: [], caps: [] };
    let currentUser = null;
    let currentFase = 'antes';

    async function login() {
        const u = document.getElementById('log-user').value;
        const p = document.getElementById('log-pass').value;

        if(u === 'admin' && p === 'admin123') {
            currentUser = { type: 'admin' };
            await refreshData();
            showScreen('scr-admin');
        } else {
            const { data: caps, error } = await supabase.from('caps').select('*').eq('usr', u).eq('pwd', p).single();
            if(caps) {
                currentUser = { type: 'cap', ...caps };
                document.getElementById('cap-name-header').innerText = caps.nom;
                await refreshData();
                showScreen('scr-cap');
            } else { alert("Acceso denegado"); }
        }
    }

    async function crearCap() {
        const nomEl = document.getElementById('c-nom');
        const usrEl = document.getElementById('c-usr');
        const pwdEl = document.getElementById('c-pwd');
        if(!nomEl.value || !usrEl.value || !pwdEl.value) return;

        await supabase.from('caps').insert([{ nom: nomEl.value, usr: usrEl.value, pwd: pwdEl.value }]);
        await refreshData();
        closeModal('mod-cap');
        nomEl.value = ''; usrEl.value = ''; pwdEl.value = '';
    }

    async function crearObra() {
        const dirEl = document.getElementById('o-dir');
        const mtsEl = document.getElementById('o-mts');
        const capEl = document.getElementById('o-cap-sel');
        const finiEl = document.getElementById('o-f-ini');
        if(!dirEl.value || !mtsEl.value) return;

        const nuevaObra = { 
            id: Date.now(), 
            dir: dirEl.value, 
            mts: parseFloat(mtsEl.value), 
            cap: capEl.value, 
            fotos: { antes:[], durante:[], despues:[] },
            estado: 'Empezada',
            f_inicio: finiEl.value || new Date().toISOString().split('T')[0]
        };

        await supabase.from('obras').insert([nuevaObra]);
        await refreshData();
        closeModal('mod-obra'); 
        dirEl.value = ''; mtsEl.value = '';
    }

    async function refreshData() {
        const { data: obras } = await supabase.from('obras').select('*');
        const { data: caps } = await supabase.from('caps').select('*');
        db.obras = obras || [];
        db.caps = caps || [];
        if(currentUser?.type === 'admin') renderObras(); else renderObrasCap();
    }

    function renderObras() {
        const cont = document.getElementById('lista-obras');
        cont.innerHTML = db.obras.map(o => `
            <button class="obra-btn" onclick="verDetalle(${o.id})">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <strong>${o.dir}</strong>
                    <span style="font-size:10px; padding:2px 6px; border-radius:5px; background:${o.estado === 'Terminada' ? '#dcfce7' : '#fef9c3'}; color:${o.estado === 'Terminada' ? '#166534' : '#854d0e'}; font-weight:bold;">${o.estado}</span>
                </div>
                <small>${o.mts}m² • Capataz: ${o.cap}</small><br>
                <small style="color:gray;">📅 ${o.f_inicio} ${o.f_fin ? ' a ' + o.f_fin : '(En curso)'}</small>
            </button>
        `).join('');
    }

    function renderObrasCap() {
        const cont = document.getElementById('lista-obras-cap');
        const misObras = db.obras.filter(o => o.cap === currentUser.nom);
        cont.innerHTML = misObras.map(o => `
            <button class="obra-btn" onclick="verDetalle(${o.id})">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <strong>${o.dir}</strong>
                    <span style="font-size:10px; padding:2px 6px; border-radius:5px; background:${o.estado === 'Terminada' ? '#dcfce7' : '#fef9c3'}; color:${o.estado === 'Terminada' ? '#166534' : '#854d0e'}; font-weight:bold;">${o.estado}</span>
                </div>
                <small>${o.mts}m² • Ver y subir fotos</small><br>
                <small style="color:gray;">📅 ${o.f_inicio} ${o.f_fin ? ' a ' + o.f_fin : '(En curso)'}</small>
            </button>
        `).join('') || '<p>No tienes obras asignadas.</p>';
    }

    function verDetalle(id) {
        const o = db.obras.find(x => x.id === id);
        const mts = parseFloat(o.mts);
        const mat = { baldosas: Math.ceil(mts/0.16), cemento: Math.ceil(mts*0.3), arena: (mts*0.04).toFixed(2) };
        const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(o.dir)}&output=embed`;

        document.getElementById('detalle-content').innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:start;">
                <h3 style="margin-bottom:5px">${o.dir}</h3>
                <select onchange="cambiarEstado(${o.id}, this.value)" style="width:auto; padding:5px; font-size:12px; margin-bottom:0;">
                    <option value="Empezada" ${o.estado === 'Empezada' ? 'selected' : ''}>Empezada</option>
                    <option value="Terminada" ${o.estado === 'Terminada' ? 'selected' : ''}>Terminada</option>
                </select>
            </div>
            <p style="font-size:12px; color:gray; margin-bottom:5px">Capataz: ${o.cap}</p>
            <p style="font-size:12px; color:gray; margin-bottom:10px">
                Inicio: ${o.f_inicio} ${o.estado === 'Terminada' ? ` | Fin: <input type="date" value="${o.f_fin || new Date().toISOString().split('T')[0]}" onchange="cambiarFechaFin(${o.id}, this.value)" style="display:inline; width:auto; padding:2px; font-size:11px; margin-bottom:0; border:none; background:transparent;">` : ''}
            </p>
            <div class="map-container"><iframe src="${mapUrl}"></iframe></div>
            <div class="mat-grid">
                <div class="mat-card"><span class="mat-val">${mat.baldosas}</span><span class="mat-label">Baldosas</span></div>
                <div class="mat-card"><span class="mat-val">${mat.cemento}</span><span class="mat-label">Cemento (Bol)</span></div>
                <div class="mat-card"><span class="mat-val">${mat.arena}m³</span><span class="mat-label">Arena</span></div>
                <div class="mat-card"><span class="mat-val">${o.mts}m²</span><span class="mat-label">Superficie</span></div>
            </div>
            <h4>Fotos de Obra</h4>
            <div class="photo-tabs">
                <div class="p-tab active" id="t-antes" onclick="switchPhotoTab(${o.id}, 'antes')">Antes</div>
                <div class="p-tab" id="t-durante" onclick="switchPhotoTab(${o.id}, 'durante')">Durante</div>
                <div class="p-tab" id="t-despues" onclick="switchPhotoTab(${o.id}, 'despues')">Después</div>
            </div>
            <div id="loader">Procesando foto...</div>
            ${currentUser.type === 'cap' ? `
                <input type="file" accept="image/*" id="fileInput" style="display:none" onchange="processPhoto(${o.id})">
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()"><i class="ti ti-camera"></i> Tomar / Subir Foto</button>
            ` : ''}
            <div class="photo-grid" id="photo-grid"></div>
            ${currentUser.type === 'admin' ? `<button class="btn btn-outline" style="color:red; margin-top:20px" onclick="eliminarObra(${o.id})">Eliminar Obra</button>` : ''}
        `;
        showScreen('scr-detalle');
        switchPhotoTab(o.id, 'antes');
    }

    function switchPhotoTab(id, fase) {
        currentFase = fase;
        document.querySelectorAll('.p-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('t-'+fase).classList.add('active');
        const o = db.obras.find(x => x.id === id);
        const grid = document.getElementById('photo-grid');
        grid.innerHTML = o.fotos[fase].map(f => `<img src="${f}" class="photo-item">`).join('') || '<p style="grid-column:span 3; font-size:12px; color:gray; text-align:center; padding:20px">Sin fotos en esta etapa.</p>';
    }

    // Función para obtener la orientación real de la foto (especial para iPhone)
    function getOrientation(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const view = new DataView(e.target.result);
            if (view.getUint16(0, false) != 0xFFD8) return callback(-2);
            let length = view.byteLength, offset = 2;
            while (offset < length) {
                const marker = view.getUint16(offset, false);
                offset += 2;
                if (marker == 0xFFE1) {
                    if (view.getUint32(offset += 2, false) != 0x45786966) return callback(-1);
                    const little = view.getUint16(offset += 6, false) == 0x4949;
                    offset += view.getUint32(offset + 4, little);
                    const tags = view.getUint16(offset, little);
                    offset += 2;
                    for (let i = 0; i < tags; i++)
                        if (view.getUint16(offset + (i * 12), little) == 0x0112)
                            return callback(view.getUint16(offset + (i * 12) + 8, little));
                }
                else if ((marker & 0xFF00) != 0xFF00) break;
                else offset += view.getUint16(offset, false);
            }
            return callback(-1);
        };
        reader.readAsArrayBuffer(file);
    }

    // --- MEJORA: COMPRESIÓN DE FOTOS ---
    function processPhoto(id) {
        const files = document.getElementById('fileInput').files;
        if(!files || files.length === 0) return;
        const file = files[0];
        
        if (!file.type.match('image.*')) {
            alert("El archivo seleccionado no es una imagen válida.");
            return;
        }

        document.getElementById('loader').style.display = 'block';

        getOrientation(file, function(orientation) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext("2d");
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_WIDTH) { width *= MAX_WIDTH / height; height = MAX_WIDTH; }
                    }

                    // Ajustar dimensiones del canvas según la orientación
                    if ([5, 6, 7, 8].indexOf(orientation) > -1) {
                        canvas.width = height;
                        canvas.height = width;
                    } else {
                        canvas.width = width;
                        canvas.height = height;
                    }

                    // Aplicar transformaciones de rotación
                    switch (orientation) {
                        case 2: ctx.transform(-1, 0, 0, 1, width, 0); break;
                        case 3: ctx.transform(-1, 0, 0, -1, width, height); break;
                        case 4: ctx.transform(1, 0, 0, -1, 0, height); break;
                        case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
                        case 6: ctx.transform(0, 1, -1, 0, height, 0); break;
                        case 7: ctx.transform(0, -1, -1, 0, height, width); break;
                        case 8: ctx.transform(0, -1, 1, 0, 0, width); break;
                        default: ctx.transform(1, 0, 0, 1, 0, 0);
                    }

                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                    const o = db.obras.find(x => x.id === id);
                    o.fotos[currentFase].push(dataUrl);
                    
                    supabase.from('obras').update({ fotos: o.fotos }).eq('id', id).then(() => {
                        document.getElementById('loader').style.display = 'none';
                        switchPhotoTab(id, currentFase);
                    });
                };
                img.onerror = function() {
                    alert("Error al procesar la imagen. Intenta tomar la foto directamente.");
                    document.getElementById('loader').style.display = 'none';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function cambiarEstado(id, nuevoEstado) {
        const o = db.obras.find(x => x.id === id);
        let f_fin = o.f_fin;
        if (nuevoEstado === 'Terminada' && !f_fin) f_fin = new Date().toISOString().split('T')[0];
        
        await supabase.from('obras').update({ estado: nuevoEstado, f_fin }).eq('id', id);
        await refreshData();
        verDetalle(id); // Refrescar para mostrar/ocultar fecha fin
    }

    async function cambiarFechaFin(id, nuevaFecha) {
        await supabase.from('obras').update({ f_fin: nuevaFecha }).eq('id', id);
        await refreshData();
    }

    async function eliminarObra(id) {
        if(confirm("¿Seguro quieres borrar esta obra y sus fotos?")) {
            await supabase.from('obras').delete().eq('id', id);
            await refreshData();
            back();
        }
    }

    function back() { 
        if(currentUser.type === 'admin') renderObras(); else renderObrasCap();
        showScreen(currentUser.type === 'admin' ? 'scr-admin' : 'scr-cap'); 
    }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function openModal(id) { 
        if(id === 'mod-obra') document.getElementById('o-cap-sel').innerHTML = db.caps.map(c => `<option value="${c.nom}">${c.nom}</option>`).join('') || '<option>Crea un capataz primero</option>';
        document.getElementById(id).classList.add('active'); 
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
</script>

</body>
</html>
