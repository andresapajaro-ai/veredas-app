<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeredasApp — Gestión de Obras</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --color-background-primary: #ffffff;
            --color-background-secondary: #f9fafb;
            --color-text-primary: #111827;
            --color-text-secondary: #4b5563;
            --color-border-tertiary: #e5e7eb;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
        }

        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-sans);background:#f3f4f6;color:var(--color-text-primary)}
        .app{max-width:500px;margin:0 auto;min-height:100vh;background:var(--color-background-primary);display:flex;flex-direction:column;box-shadow:0 0 20px rgba(0,0,0,0.05)}
        .screen{display:none;flex-direction:column;flex:1}
        .screen.active{display:flex}

        /* Login */
        .login-wrap{display:flex;align-items:center;justify-content:center;flex:1;background:var(--color-background-secondary)}
        .login-box{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:2rem;width:90%}
        .login-logo{text-align:center;margin-bottom:1.5rem}
        .logo-icon{width:52px;height:52px;background:#1D9E75;border-radius:var(--border-radius-md);display:inline-flex;align-items:center;justify-content:center;margin-bottom:0.75rem;color:#fff;font-size:26px}
        .login-title{font-size:18px;font-weight:600;margin-bottom:4px}
        .login-field{margin-bottom:1rem}
        .login-field label{display:block;font-size:13px;color:var(--color-text-secondary);margin-bottom:6px}
        .login-field input{width:100%;padding:10px;border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md)}
        .login-btn{width:100%;padding:12px;background:#1D9E75;color:#fff;border:none;border-radius:var(--border-radius-md);font-weight:600;cursor:pointer}
        .login-err{color:#E24B4A;font-size:12px;margin-top:8px;text-align:center;min-height:18px}

        /* Topbar */
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--color-border-tertiary)}
        .topbar-logo{width:32px;height:32px;background:#1D9E75;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
        .btn-logout{font-size:12px;color:var(--color-text-secondary);background:none;border:1px solid var(--color-border-tertiary);padding:5px 10px;border-radius:6px;cursor:pointer}

        /* Main Content */
        .main{flex:1;overflow-y:auto;padding:16px}
        .tabs{display:flex;gap:10px;margin-bottom:16px;border-bottom:1px solid var(--color-border-tertiary)}
        .tab-btn{padding:8px 12px;background:none;border:none;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent}
        .tab-btn.active{color:#1D9E75;border-bottom-color:#1D9E75;font-weight:600}
        .tab-panel{display:none}.tab-panel.active{display:block}

        /* Obras & Cards */
        .obra-card{background:#fff;border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:10px;cursor:pointer}
        .obra-status{font-size:11px;padding:2px 8px;border-radius:20px;text-transform:capitalize}
        .st-activa{background:#E1F5EE;color:#0F6E56}
        .st-pendiente{background:#FAEEDA;color:#854F0B}
        
        /* Modales */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100}
        .modal-overlay.open{display:flex}
        .modal{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:400px}
        
        /* Toast */
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1D9E75;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;opacity:0;transition:0.3s;pointer-events:none}
        .toast.show{opacity:1}
    </style>
</head>
<body>

<div class="app">
    <div class="screen active" id="s-login">
        <div class="login-wrap">
            <div class="login-box">
                <div class="login-logo">
                    <div class="logo-icon"><i class="ti ti-road"></i></div>
                    <div class="login-title">VeredasApp</div>
                </div>
                <div class="login-field"><label>Usuario</label><input type="text" id="inp-user" placeholder="admin"></div>
                <div class="login-field"><label>Contraseña</label><input type="password" id="inp-pass" placeholder="admin123"></div>
                <button class="login-btn" onclick="doLogin()">Ingresar</button>
                <div class="login-err" id="login-err"></div>
            </div>
        </div>
    </div>

    <div class="screen" id="s-admin">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="topbar-logo"><i class="ti ti-road"></i></div>
                <span style="font-weight:600">Panel Admin</span>
            </div>
            <button class="btn-logout" onclick="location.reload()">Salir</button>
        </div>
        <div class="main">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('obras')">Obras</button>
                <button class="tab-btn" onclick="switchTab('capataces')">Capataces</button>
            </div>
            <div id="tab-obras" class="tab-panel active">
                <button onclick="openModal('modal-obra')" style="width:100%;padding:10px;background:#1D9E75;color:#fff;border:none;border-radius:8px;margin-bottom:15px">+ Nueva Obra</button>
                <div id="obras-grid"></div>
            </div>
            <div id="tab-capataces" class="tab-panel">
                <button onclick="openModal('modal-cap')" style="width:100%;padding:10px;background:#1D9E75;color:#fff;border:none;border-radius:8px;margin-bottom:15px">+ Nuevo Capataz</button>
                <div id="cap-list"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-obra">
    <div class="modal">
        <h3>Nueva Obra</h3><br>
        <input type="text" id="m-dir" placeholder="Dirección" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px">
        <input type="number" id="m-mts" placeholder="Metros m²" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px">
        <select id="m-cap" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px"></select>
        <div style="display:flex;gap:10px">
            <button onclick="closeModal('modal-obra')" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ddd">Cancelar</button>
            <button onclick="saveObra()" style="flex:1;padding:10px;background:#1D9E75;color:#fff;border:none;border-radius:8px">Guardar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-cap">
    <div class="modal">
        <h3>Nuevo Capataz</h3><br>
        <input type="text" id="c-nombre" placeholder="Nombre Completo" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px">
        <input type="text" id="c-user" placeholder="Usuario" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px">
        <input type="password" id="c-pass" placeholder="Contraseña" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px">
        <div style="display:flex;gap:10px">
            <button onclick="closeModal('modal-cap')" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ddd">Cancelar</button>
            <button onclick="saveCap()" style="flex:1;padding:10px;background:#1D9E75;color:#fff;border:none;border-radius:8px">Guardar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">Acción realizada</div>

<script>
const KEY_OBRAS = 'v-obras';
const KEY_CAPS = 'v-caps';

let state = {
    obras: JSON.parse(localStorage.getItem(KEY_OBRAS)) || [],
    capataces: JSON.parse(localStorage.getItem(KEY_CAPS)) || []
};

// --- PERSISTENCIA CORREGIDA ---
function persist() {
    localStorage.setItem(KEY_OBRAS, JSON.stringify(state.obras));
    localStorage.setItem(KEY_CAPS, JSON.stringify(state.capataces));
}

function doLogin() {
    const u = document.getElementById('inp-user').value;
    const p = document.getElementById('inp-pass').value;
    if(u === 'admin' && p === 'admin123') {
        document.getElementById('s-login').classList.remove('active');
        document.getElementById('s-admin').classList.add('active');
        renderObras();
    } else {
        document.getElementById('login-err').textContent = "Credenciales incorrectas";
    }
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if(tab === 'obras') renderObras();
    if(tab === 'capataces') renderCaps();
}

function renderObras() {
    const grid = document.getElementById('obras-grid');
    grid.innerHTML = state.obras.map(o => `
        <div class="obra-card">
            <div style="display:flex;justify-content:space-between">
                <strong>${o.dir}</strong>
                <span class="obra-status st-activa">Activa</span>
            </div>
            <div style="font-size:12px;color:gray;margin-top:5px">${o.mts} m² • Capataz: ${o.cap || 'Sin asignar'}</div>
        </div>
    `).join('');
}

function renderCaps() {
    const list = document.getElementById('cap-list');
    list.innerHTML = state.capataces.map(c => `
        <div style="padding:12px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
            <div><strong>${c.nombre}</strong><br><small>@${c.user}</small></div>
            <button onclick="deleteCap('${c.user}')" style="color:red;border:none;background:none">Eliminar</button>
        </div>
    `).join('');
}

function openModal(id) {
    if(id === 'modal-obra') {
        const sel = document.getElementById('m-cap');
        sel.innerHTML = '<option value="">Asignar capataz...</option>' + 
            state.capataces.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
    }
    document.getElementById(id).classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function saveCap() {
    const nombre = document.getElementById('c-nombre').value;
    const user = document.getElementById('c-user').value;
    const pass = document.getElementById('c-pass').value;
    if(!nombre || !user || !pass) return alert("Completa todos los campos");
    state.capataces.push({ nombre, user, pass });
    persist();
    renderCaps();
    closeModal('modal-cap');
    showToast("Capataz guardado");
}

function saveObra() {
    const dir = document.getElementById('m-dir').value;
    const mts = document.getElementById('m-mts').value;
    const cap = document.getElementById('m-cap').value;
    if(!dir || !mts) return alert("Completa los datos");
    state.obras.push({ dir, mts, cap });
    persist();
    renderObras();
    closeModal('modal-obra');
    showToast("Obra creada");
}

function deleteCap(user) {
    state.capataces = state.capataces.filter(c => c.user !== user);
    persist();
    renderCaps();
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}
</script>

</body>
</html>
